<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover"
		/>
		<meta
			name="description"
			content="Acompanhamento em tempo real, rotas e paradas do transporte intracampus da UFC Sobral."
		/>
		<title>INTRA UFC | Transporte intracampus</title>

		<!-- Configurações PWA e Mobile-First -->
		<link rel="manifest" href="manifest.webmanifest" />
		<meta name="theme-color" content="#172b3a" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Intra UFC" />
		<link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
		<link rel="apple-touch-icon" href="icons/icon-192.png" />

		<!-- Estilos da Aplicação -->
		<link rel="stylesheet" href="css/global.css" />
		<link rel="stylesheet" href="css/components.css" />
		<link rel="stylesheet" href="css/responsive.css" />
		<link
			rel="stylesheet"
			href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
			crossorigin=""
		/>
	</head>
	<body>
		<header class="site-header">
			<a class="brand" href="index.html" aria-label="INTRA UFC - inicio">
				<span class="brand__mark" aria-hidden="true">IU</span>
				<span class="brand__title">INTRA UFC</span>
			</a>

			<!-- Botão de Instalação PWA (visível quando disponível no navegador) -->
			<button id="pwa-install-btn" class="btn-install" hidden type="button">
				<span class="install-icon">📲</span> Instalar App
			</button>
		</header>

		<main>
			<section class="map-section" id="mapa" aria-labelledby="mapa-titulo">
				<div class="page-shell">
					<div class="section-heading">
						<p class="eyebrow">Mobilidade em Sobral</p>
						<h1 id="mapa-titulo">Mapa do Intracampus</h1>
						<p class="section-heading__description">
							Encontre as principais paradas e planeje seu deslocamento entre os
							campi da UFC Sobral.
						</p>
					</div>

					<!-- Barra de Status do Ônibus e Legenda -->
					<div class="live-status-bar">
						<div class="live-status-indicator">
							<span class="live-dot waiting" id="live-dot"></span>
							<span id="live-status-text">Localizando ônibus...</span>
						</div>
						<div class="routes-legend">
							<span class="route-pill"><span class="route-color ida"></span> Ida</span>
							<span class="route-pill"><span class="route-color volta"></span> Volta</span>
						</div>
					</div>

					<div class="map-layout">
						<!-- Container do Mapa com Controles Flutuantes (FABs) -->
						<div class="map-wrapper">
							<div id="map" aria-label="Mapa interativo da UFC Sobral"></div>

							<!-- Botões de Ação Rápida Flutuantes (Mobile-First) -->
							<div class="map-fab-container">
								<button
									id="btn-track-bus"
									class="map-fab"
									type="button"
									title="Centralizar no Ônibus"
									aria-label="Centralizar no Ônibus"
								>
									🚌
								</button>
								<button
									id="btn-my-location"
									class="map-fab"
									type="button"
									title="Minha Localização GPS"
									aria-label="Minha Localização GPS"
								>
									📍
								</button>
								<button
									id="btn-refresh-live"
									class="map-fab"
									type="button"
									title="Atualizar Sinal"
									aria-label="Atualizar Sinal"
								>
									🔄
								</button>
							</div>
						</div>

						<!-- Painel de Paradas (Gaveta/Bottom Sheet no Mobile, Lateral no Desktop) -->
						<aside class="stops-panel" id="stops-panel" aria-labelledby="paradas-titulo">
							<div class="drawer-handle-bar" id="drawer-toggle" role="button" tabindex="0" aria-label="Expandir ou recolher lista de paradas">
								<div class="drawer-handle"></div>
							</div>
							<div class="stops-panel-header">
								<div>
									<p class="eyebrow">Pontos de referência</p>
									<h2 id="paradas-titulo">Principais paradas</h2>
								</div>
								<span class="drawer-badge" id="stops-count-badge">6 paradas</span>
							</div>
							<ul class="stops-list" id="stops-list">
								<!-- Preenchido dinamicamente via JS -->
							</ul>
						</aside>
					</div>
				</div>
			</section>
		</main>

		<!-- Modal de Instruções de Instalação PWA (Suporte iOS / Safari e outros) -->
		<div id="pwa-install-modal" class="pwa-modal-overlay" hidden>
			<div class="pwa-modal-card">
				<div class="pwa-modal-header">
					<div class="pwa-app-icon">
						<img src="icons/icon.svg" alt="Ícone INTRA UFC" width="48" height="48" />
					</div>
					<div class="pwa-modal-title-group">
						<h3>Instalar INTRA UFC</h3>
						<p>Adicione à tela de início para usar como app</p>
					</div>
					<button id="pwa-modal-close" class="pwa-modal-close" type="button" aria-label="Fechar">&times;</button>
				</div>
				<div class="pwa-modal-body" id="pwa-modal-body">
					<!-- Preenchido via JavaScript de acordo com o sistema operacional -->
				</div>
			</div>
		</div>

		<!-- Scripts -->
		<script
			src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
			integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
			crossorigin=""
		></script>
		<script src="js/data.js"></script>
		<script src="js/main.js"></script>
	</body>
</html>
