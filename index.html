<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta
			name="description"
			content="Consulte as rotas e paradas do transporte intracampus da UFC Sobral."
		/>
		<title>INTRA UFC | Transporte intracampus</title>
		<link rel="stylesheet" href="css/global.css" />
		<link rel="stylesheet" href="css/components.css" />
		<link rel="stylesheet" href="css/responsive.css" />
		<link
			rel="stylesheet"
			href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
			integrity="sha256-p4NxAoJBhIINfQ3eR0hV5Xx4Vf7f4f4JQ1J5F6Y6Jk="
			crossorigin=""
		/>
	</head>
	<body>
		<header class="site-header">
			<a class="brand" href="index.html" aria-label="INTRA UFC - inicio">
				<span class="brand__mark" aria-hidden="true">IU</span>
				<span>INTRA UFC</span>
			</a>
		</header>

		<main>
			<section class="map-section" id="mapa" aria-labelledby="mapa-titulo">
				<div class="page-shell">
					<div class="section-heading">
						<p class="eyebrow">Mobilidade em Sobral</p>
						<h1 id="mapa-titulo">Mapa do Intracampus</h1>
						<p class="section-heading__description">
							Encontre as principais paradas e planeje seu deslocamento entre os
							campi da UFC Sobral.
						</p>
					</div>

					<div class="map-layout">
						<div id="map" aria-label="Mapa interativo da UFC Sobral"></div>

						<aside class="stops-panel" aria-labelledby="paradas-titulo">
							<div>
								<p class="eyebrow">Pontos de referencia</p>
								<h2 id="paradas-titulo">Principais paradas</h2>
							</div>
							<ul class="stops-list">
								<li>Mucambinho</li>
								<li>FAMED</li>
								<li>SPA</li>
								<li>Santa Casa</li>
								<li>Pedrinhas</li>
								<li>Cadeia Criativa</li>
							</ul>
						</aside>
					</div>
				</div>
			</section>
		</main>
		<script
			src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
			integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
			crossorigin=""
		></script>
	</body>
</html>
