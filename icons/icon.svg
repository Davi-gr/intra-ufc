<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#172b3a"/>
      <stop offset="100%" stop-color="#0d1b24"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f27d4f"/>
      <stop offset="100%" stop-color="#e86a3a"/>
    </linearGradient>
  </defs>
  
  <!-- Fundo com cantos arredondados (squircle app icon) -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Faixa de destaque inferior -->
  <path d="M 0,384 Q 256,410 512,384 L 512,400 Q 512,512 400,512 L 112,512 Q 0,512 0,400 Z" fill="url(#accent)"/>
  
  <!-- Ícone do Ônibus estilizado -->
  <g transform="translate(136, 110)">
    <!-- Corpo do Ônibus -->
    <rect x="10" y="20" width="220" height="230" rx="36" fill="#ffffff" />
    <path d="M 10,130 L 230,130 L 230,214 Q 230,250 194,250 L 46,250 Q 10,250 10,214 Z" fill="#e2e8f0"/>
    
    <!-- Para-brisa dianteiro -->
    <rect x="30" y="44" width="180" height="74" rx="14" fill="#172b3a"/>
    
    <!-- Linha de destino / letreiro -->
    <rect x="70" y="28" width="100" height="10" rx="5" fill="#e86a3a"/>
    
    <!-- Faróis -->
    <circle cx="48" cy="170" r="14" fill="#fbbf24"/>
    <circle cx="192" cy="170" r="14" fill="#fbbf24"/>
    
    <!-- Grade frontal -->
    <rect x="85" y="162" width="70" height="16" rx="8" fill="#94a3b8"/>
    
    <!-- Rodas -->
    <rect x="2" y="220" width="16" height="36" rx="8" fill="#0f172a"/>
    <rect x="222" y="220" width="16" height="36" rx="8" fill="#0f172a"/>
  </g>
  
  <!-- Badge IU -->
  <g transform="translate(320, 48)">
    <circle cx="36" cy="36" r="36" fill="url(#accent)"/>
    <text x="36" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="900" fill="#ffffff" text-anchor="middle">IU</text>
  </g>
</svg>
