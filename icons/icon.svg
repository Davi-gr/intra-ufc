<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="terracotta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eb7648"/>
      <stop offset="100%" stop-color="#bd4c23"/>
    </linearGradient>
  </defs>

  <!-- Fundo com o formato e cor de identidade do INTRA UFC -->
  <rect width="512" height="512" rx="104" fill="url(#terracotta)"/>

  <!-- Marca Oficial IU com a tipografia do projeto -->
  <text
    x="256"
    y="340"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
    font-size="240"
    font-weight="900"
    letter-spacing="-6px"
    fill="#fffdf8"
    text-anchor="middle"
  >IU</text>

  <!-- Subtítulo sutil INTRA UFC -->
  <rect x="176" y="380" width="160" height="8" rx="4" fill="#fffdf8" opacity="0.6"/>
</svg>
